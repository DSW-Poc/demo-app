name: ci
on: [push, pull_request]

jobs:
  build:
    uses: DSW-Poc/reusable-workflows/.github/workflows/build-test.yml@v1
    with:
      node-version: "22"

  report:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Built artifact ${{ needs.build.outputs.artifact-name }}"

  whoami-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:                      # the caller grants; the reusable workflow can only reduce
      id-token: write
      contents: read
    uses: DSW-Poc/reusable-workflows/.github/workflows/aws-identity.yml@v1
    with:
      environment: dev
      role-arn: ${{ vars.AWS_ROLE_ARN_DEV }}   # repo variable, not a secret: no keys anywhere
      aws-region: ${{ vars.AWS_REGION }}
